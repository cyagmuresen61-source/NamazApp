<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hayat Düzenleyici & İbadet Takip</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #004d40;
            --app-bg-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?q=80&w=1000&auto=format&fit=crop');
            --glass-bg: rgba(0, 0, 0, 0.45); 
            --glass-border: rgba(255, 255, 255, 0.35);
            --text-color: #fff;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000; 
            color: var(--text-color); 
            margin: 0; 
            padding: 0;
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container { 
            background: var(--app-bg-image); 
            background-size: cover;
            background-position: center;
            width: 100%; 
            max-width: 450px; 
            height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .app-container {
                height: 92vh;
                border-radius: 28px;
            }
        }

        .header { padding: 20px; text-align: center; color: white; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
        h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }

        .tabs { display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.35); padding: 8px 0; border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(2px); }
        .tab-btn { background: none; border: none; font-size: 14px; font-weight: 600; cursor: pointer; color: #ddd; text-shadow: 0 1px 3px rgba(0,0,0,0.8); padding: 6px 14px; border-radius: 20px; transition: 0.2s; }
        .tab-btn.active { color: white; background-color: var(--primary-color); text-shadow: none; }

        .content-area { flex: 1; overflow-y: auto; padding: 15px 20px; background: rgba(0, 0, 0, 0.15); backdrop-filter: blur(3px); border-top-left-radius: 20px; border-top-right-radius: 20px; }

        .section { display: none; }
        .section.active { display: block; }

        .location-banner { background: var(--glass-bg); padding: 10px; border-radius: 10px; text-align: center; font-size: 13px; margin-bottom: 15px; color: #fff; font-weight: bold; border: 1px solid var(--glass-border); text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        
        .task-list { margin-bottom: 15px; }
        .task { margin: 8px 0; display: flex; align-items: center; font-size: 15px; justify-content: space-between; background: var(--glass-bg); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--glass-border); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .task-left { display: flex; align-items: center; gap: 10px; }
        .task input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--primary-color); }
        .task-time { font-size: 11px; color: #fff; background: rgba(0, 0, 0, 0.5); padding: 3px 8px; border-radius: 6px; font-weight: 600; border: 1px solid rgba(255,255,255,0.2); }

        .add-task-box { display: flex; gap: 8px; margin-top: 15px; }
        .add-task-box input { flex: 1; padding: 10px; border: 1px solid var(--glass-border); border-radius: 8px; font-size: 14px; outline: none; background: var(--glass-bg); color: #fff; }
        .add-task-box input::placeholder { color: #ddd; }
        .btn { background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .btn:active { transform: scale(0.98); }

        .chart-container { display: flex; flex-direction: column; align-items: center; margin: 15px 0; }
        #progress-circle { width: 100px; height: 100px; border-radius: 50%; background: conic-gradient(var(--primary-color) 0%, rgba(255,255,255,0.3) 0%); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 8px rgba(0,0,0,0.4); }
        #progress-text { width: 78px; height: 78px; background: rgba(0, 0, 0, 0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #fff; border: 1px solid var(--glass-border); }
        
        .archive-box { background: var(--glass-bg); padding: 12px; border-radius: 10px; margin-top: 10px; border-left: 4px solid var(--primary-color); border: 1px solid var(--glass-border); font-size: 13px; cursor: pointer; color: #fff; }
        .archive-detail { background: rgba(0, 0, 0, 0.7); padding: 8px; border-radius: 6px; margin-top: 8px; border: 1px dashed var(--glass-border); font-size: 12px; color: #fff; }
        .detail-item { display: flex; justify-content: space-between; margin: 4px 0; }
        .done { color: #81c784; font-weight: bold; }
        .not-done { color: #e57373; }

        .setting-group { margin: 15px 0; }
        .setting-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
        
        .sound-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .sound-select { flex: 1; padding: 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .sound-select option { background: #222; color: #fff; }
        .test-btn { background: #ff9800; color: white; border: none; padding: 0 12px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-size: 13px; }

        .upload-box { background: var(--glass-bg); border: 1px dashed var(--glass-border); padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; }
        .upload-box input { display: none; }
        .upload-label { background: #00796b; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: inline-block; font-weight: bold; margin-top: 4px; }
        .delete-audio-btn { background: #c62828; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 6px; display: none; }

        .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 180px; overflow-y: auto; padding-right: 4px; }
        .theme-card { height: 65px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.9); cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; color: white; font-weight: bold; font-size: 12px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); box-shadow: 0 4px 10px rgba(0,0,0,0.4); background-size: cover; background-position: center; transition: 0.2s; }
        .theme-card:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">
    <div class="header">
        <h2>Hayat Düzenleyici</h2>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tasks-sec')">Bugün</button>
        <button class="tab-btn" onclick="switchTab('archive-sec')">Arşiv</button>
        <button class="tab-btn" onclick="switchTab('settings-sec')">Ayarlar</button>
    </div>

    <div class="content-area">
        <!-- 1. GÖREVLER SEKMESİ -->
        <div id="tasks-sec" class="section active">
            <div class="location-banner" id="locationBanner">
                📍 Şanlıurfa Vakitleri Yükleniyor...
            </div>

            <div class="task-list" id="task-list-container"></div>

            <div class="add-task-box">
                <input type="text" id="newTaskInput" placeholder="Yeni görev ekle...">
                <button class="btn" style="width: auto;" onclick="addNewTask()">Ekle</button>
            </div>

            <div class="chart-container">
                <div id="progress-circle">
                    <div id="progress-text">0%</div>
                </div>
                <p id="message" style="margin-top:8px; font-weight:bold; font-size: 13px; text-align:center; text-shadow:0 1px 2px rgba(0,0,0,0.8);">Günlük görevleri tamamla.</p>
            </div>

            <button class="btn" style="margin-top: 10px; background-color: #e65100;" onclick="finishDay()">Günü Tamamla & Arşivle</button>
        </div>

        <!-- 2. ARŞİV SEKMESİ -->
        <div id="archive-sec" class="section">
            <h3 style="margin-top:0; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.8);">Geçmiş Günler</h3>
            <div id="archive-container">
                <p style="text-align: center; color: #ddd; font-size: 13px;">Henüz kayıt yok.</p>
            </div>
        </div>

        <!-- 3. AYARLAR SEKMESİ -->
        <div id="settings-sec" class="section">
            <h3 style="margin-top:0; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.8);">Uygulama Ayarları</h3>
            
            <div class="setting-group">
                <label>🎶 Bildirim Sesini Seç ve Test Et</label>
                <div class="sound-row">
                    <select id="notificationSound" class="sound-select">
                        <option value="none">🔕 Sesi Kapat (Sessiz)</option>
                        <option value="ezan">🕌 Zengin Ezan Melodisi (Garantili Çalışır)</option>
                        <option value="sabah">🌅 Sabah Ezanı Tonu</option>
                        <option value="bip">🔔 Dijital Bip Sesi</option>
                        <option value="zil">🛎️ Huzurlu Çan Sesi</option>
                        <option id="customOption" value="custom" style="display:none;">📁 Kendi Yüklediğin Ses</option>
                    </select>
                    <button class="test-btn" onclick="testSound()">Dinle</button>
                    <button class="test-btn" style="background:#d32f2f;" onclick="stopAudio()">Dur</button>
                </div>
                
                <div class="upload-box">
                    <span>Telefonundan özel ses dosyası (.mp3) seç:</span><br>
                    <label class="upload-label">
                        📂 Dosya Seç
                        <input type="file" id="customAudioFile" accept="audio/*" onchange="handleCustomAudio(event)">
                    </label>
                    <button id="deleteAudioBtn" class="delete-audio-btn" onclick="deleteCustomAudio()">🗑️ Sesi Sil</button>
                    <div id="fileNameDisplay" style="font-size: 11px; margin-top: 4px; color: #ffeb3b;"></div>
                </div>
            </div>

            <div class="setting-group">
                <label>Arka Plan Temasını Seç</label>
                <div class="theme-grid">
                    <div class="theme-card" style="background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?q=80&w=400&auto=format&fit=crop');" onclick="setTheme('#004d40', 'linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url(\'https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?q=80&w=1000&auto=format&fit=crop\')')">🕌 Sultan Ahmet</div>
                    <div class="theme-card" style="background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1609599006353-e629aaabfeae?q=80&w=400&auto=format&fit=crop');" onclick="setTheme('#0d47a1', 'linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url(\'https://images.unsplash.com/photo-1609599006353-e629aaabfeae?q=80&w=1000&auto=format&fit=crop\')')">📖 Kur'an</div>
                    <div class="theme-card" style="background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=400&auto=format&fit=crop');" onclick="setTheme('#4e342e', 'linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url(\'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=1000&auto=format&fit=crop\')')">📚 Kitap</div>
                    <div class="theme-card" style="background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=400&auto=format&fit=crop');" onclick="setTheme('#37474f', 'linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url(\'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000&auto=format&fit=crop\')')">🌿 Doğa</div>
                </div>
            </div>

            <div class="setting-group" style="margin-top: 10px;">
                <label style="text-shadow: none;"><input type="checkbox" id="notifCheck" checked style="width: 18px; height: 18px; vertical-align: middle;" onclick="requestNotifPermission()"> Şanlıurfa Ezan Bildirimleri Aktif</label>
            </div>
        </div>
    </div>
</div>

<script>
    let tasks = [
        { title: "Sabah Namazı", time: "04:00", completed: false, isNamaz: true },
        { title: "Öğle Namazı", time: "12:30", completed: false, isNamaz: true },
        { title: "İkindi Namazı", time: "16:15", completed: false, isNamaz: true },
        { title: "Akşam Namazı", time: "19:50", completed: false, isNamaz: true },
        { title: "Yatsı Namazı", time: "21:20", completed: false, isNamaz: true },
        { title: "2 Sayfa Kur'an-ı Kerim", time: "Esnek", completed: false, isNamaz: false },
        { title: "10 Sayfa Kitap Oku", time: "Esnek", completed: false, isNamaz: false }
    ];

    let archives = [];
    let customAudioUrl = null;
    let currentAudio = new Audio();
    let activeOscillators = [];

    function handleCustomAudio(event) {
        const file = event.target.files[0];
        if (file) {
            customAudioUrl = URL.createObjectURL(file);
            document.getElementById('fileNameDisplay').innerHTML = `Yüklenen: ${file.name}`;
            const customOpt = document.getElementById('customOption');
            customOpt.style.display = 'block';
            document.getElementById('notificationSound').value = 'custom';
            document.getElementById('deleteAudioBtn').style.display = 'inline-block';
            alert("Özel ses başarıyla yüklendi ve seçildi!");
        }
    }

    function deleteCustomAudio() {
        stopAudio();
        customAudioUrl = null;
        document.getElementById('customAudioFile').value = '';
        document.getElementById('fileNameDisplay').innerHTML = '';
        const customOpt = document.getElementById('customOption');
        customOpt.style.display = 'none';
        document.getElementById('deleteAudioBtn').style.display = 'none';
        document.getElementById('notificationSound').value = 'none';
        alert("Özel ses başarıyla silindi ve ses kapatıldı.");
    }

    async function fetchPrayerTimes() {
        try {
            const today = new Date();
            const dateStr = `${String(today.getDate()).padStart(2, '0')}-${String(today.getMonth() + 1).padStart(2, '0')}-${today.getFullYear()}`;
            const response = await fetch(`https://api.aladhan.com/v1/timingsByCity/${dateStr}?city=Sanliurfa&country=Turkey&method=13`);
            const data = await response.json();
            
            if(data && data.data) {
                const timings = data.data.timings;
                tasks[0].time = timings.Fajr;
                tasks[1].time = timings.Dhuhr;
                tasks[2].time = timings.Asr;
                tasks[3].time = timings.Maghrib;
                tasks[4].time = timings.Esha;
                
                document.getElementById('locationBanner').innerHTML = `📍 Şanlıurfa Merkez Vakitleri Senkronize Edildi`;
                renderTasks();
            }
        } catch (e) {
            renderTasks();
        }
    }

    function checkPrayerTimes() {
        const now = new Date();
        const currentTime = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

        tasks.forEach(task => {
            if(task.isNamaz && task.time === currentTime && !task.notified) {
                task.notified = true;
                triggerNotification(task.title);
            }
        });
    }

    function stopAudio() {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        activeOscillators.forEach(osc => {
            try { osc.stop(); } catch(e) {}
        });
        activeOscillators = [];
    }

    // Telefonda hata vermeyen, internet gerektirmeyen gelişmiş ezan makamı sentezleyicisi
    function playSound(soundSetting) {
        stopAudio(); 

        if (soundSetting === 'none') {
            return; // Sessiz
        }
        
        if (soundSetting === 'custom' && customAudioUrl) {
            currentAudio.src = customAudioUrl;
            currentAudio.play().catch(e => alert("Cihazınız bu dosya türünü desteklemiyor."));
            return;
        }

        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if (soundSetting === 'bip') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 440;
                osc.start();
                activeOscillators.push(osc);
                setTimeout(() => osc.stop(), 1000);
            } 
            else if (soundSetting === 'zil') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 800;
                osc.start();
                activeOscillators.push(osc);
                setTimeout(() => osc.stop(), 1200);
            }
            else if (soundSetting === 'ezan' || soundSetting === 'sabah' || soundSetting === 'auto') {
                // Uzun, kulak tırmalamayan ve geleneksel ezan makamını andıran çoklu nota dizilimi
                const freqs = [220, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 523.25, 440.00, 392.00, 329.63, 261.63];
                const delays = [0, 400, 900, 1400, 2000, 2700, 3500, 4400, 5400, 6300, 7100, 8000];
                const lengths = [350, 450, 450, 500, 600, 700, 800, 900, 800, 700, 700, 1200];

                freqs.forEach((f, i) => {
                    let t = setTimeout(() => {
                        if(audioCtx.state === 'closed') return;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'sine';
                        osc.frequency.value = f;
                        
                        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (lengths[i]/1000));
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.start();
                        osc.stop(audioCtx.currentTime + (lengths[i]/1000));
                        activeOscillators.push(osc);
                    }, delays[i]);
                });
            }
        } catch(e) {
            console.log("Ses çalma hatası:", e);
        }
    }

    function testSound() {
        const selectedSound = document.getElementById('notificationSound').value;
        playSound(selectedSound);
    }

    function triggerNotification(taskTitle) {
        const selectedSound = document.getElementById('notificationSound').value;
        playSound(selectedSound);

        if (window.Notification && Notification.permission === "granted") {
            new Notification("Vakit Girdi!", {
                body: `${taskTitle} vakti geldi. Haydi göreve!`,
                icon: "icon(4).png"
            });
        }
    }

    function renderTasks() {
        const container = document.getElementById('task-list-container');
        container.innerHTML = '';
        
        tasks.forEach((task, index) => {
            container.innerHTML += `
                <div class="task">
                    <div class="task-left">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                        <span>${task.title}</span>
                    </div>
                    <span class="task-time">${task.time}</span>
                </div>
            `;
        });
        updateProgress();
    }

    function toggleTask(index) {
        tasks[index].completed = !tasks[index].completed;
        updateProgress();
    }

    function addNewTask() {
        const input = document.getElementById('newTaskInput');
        if (input.value.trim() !== '') {
            tasks.push({ title: input.value, time: "Esnek", completed: false, isNamaz: false });
            input.value = '';
            renderTasks();
        }
    }

    function updateProgress() {
        const total = tasks.length;
        if (total === 0) return;
        let checked = tasks.filter(t => t.completed).length;
        const percentage = Math.round((checked / total) * 100);

        const circle = document.getElementById('progress-circle');
        const text = document.getElementById('progress-text');
        const message = document.getElementById('message');
        const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim();

        circle.style.background = `conic-gradient(${primaryColor} ${percentage}%, rgba(255,255,255,0.3) 0%)`;
        text.innerHTML = `${percentage}%`;
        message.innerHTML = `Tamamlanan: ${checked} / ${total} (%${percentage})`;
    }

    function finishDay() {
        const completedCount = tasks.filter(t => t.completed).length;
        const totalCount = tasks.length;
        const percentage = Math.round((completedCount / totalCount) * 100);
        const todayDate = new Date().toLocaleDateString('tr-TR');
        
        archives.unshift({
            date: todayDate,
            rate: percentage,
            tasksSnapshot: JSON.parse(JSON.stringify(tasks))
        });

        renderArchives();
        tasks.forEach(t => { t.completed = false; t.notified = false; });
        stopAudio();
        renderTasks();
        alert("Gün başarıyla arşivlendi! Yarının görevleri sıfırlandı.");
    }

    function renderArchives() {
        const container = document.getElementById('archive-container');
        if (archives.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #ddd; font-size: 13px;">Henüz kayıt yok.</p>';
            return;
        }
        
        container.innerHTML = '';
        archives.forEach((arc, index) => {
            let detailHtml = `<div class="archive-detail" id="detail-${index}" style="display:none;">`;
            arc.tasksSnapshot.forEach(t => {
                let statusClass = t.completed ? "done" : "not-done";
                let statusText = t.completed ? "✔ Tamamlandı" : "❌ Yapılmadı";
                detailHtml += `<div class="detail-item"><span>${t.title}</span><span class="${statusClass}">${statusText}</span></div>`;
            });
            detailHtml += `</div>`;

            container.innerHTML += `
                <div class="archive-box" onclick="toggleArchiveDetail(${index})">
                    <strong>📅 ${arc.date}</strong> — Başarı: %${arc.rate}
                    <div style="font-size: 10px; color: #ddd; margin-top: 2px;">Detay için tıkla ▼</div>
                    ${detailHtml}
                </div>
            `;
        });
    }

    function toggleArchiveDetail(index) {
        const detailEl = document.getElementById(`detail-${index}`);
        detailEl.style.display = (detailEl.style.display === 'none') ? 'block' : 'none';
    }

    function switchTab(sectionId) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(sectionId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function setTheme(color, bgImage) {
        document.documentElement.style.setProperty('--primary-color', color);
        document.documentElement.style.setProperty('--app-bg-image', bgImage);
        updateProgress();
    }

    function requestNotifPermission() {
        if (window.Notification && Notification.permission !== "granted") {
            Notification.requestPermission();
        }
    }

    fetchPrayerTimes();
    setInterval(checkPrayerTimes, 30000);
    renderTasks();
</script>
